<html lang="en">
<head>
<meta charset="utf-8">

<title>WebGenius AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#12163a;--mut:#5d6385;--line:#dde1f0;--acc:#3b4cf0;--acc2:#ff5d73;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1022;--card:#161a33;--ink:#eef0ff;--mut:#9aa0c7;--line:#2a2f55;--acc:#7b88ff}}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;line-height:1.08;margin:0}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;max-width:1120px;margin:0 auto}
.brand{font-weight:800;font-size:20px;text-decoration:none}.brand i{color:var(--acc2);font-style:normal}
select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
select{width:auto}textarea{resize:vertical;min-height:110px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:600;cursor:pointer;text-decoration:none;font-size:16px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px}
.hero{padding:56px 0 40px;display:grid;gap:36px;grid-template-columns:1.1fr .9fr;align-items:center}
.hero h1{font-size:clamp(38px,7vw,72px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--mut);font-size:19px;max-width:520px;margin:18px 0 26px}
.demo{display:inline-block;border:1px dashed var(--acc2);color:var(--acc2);border-radius:99px;padding:3px 12px;font-size:13px;margin-bottom:16px}
.mock{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(40,50,180,.45)}
.mock b{display:block;height:10px;background:var(--line)}
.mock div{padding:26px}.mock .h{height:22px;width:70%;background:var(--acc);border-radius:6px;margin-bottom:12px}
.mock .l{height:10px;background:var(--line);border-radius:5px;margin:8px 0}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 26px 26px}.mock .g span{height:64px;border-radius:10px;background:var(--line)}
.mock .g span:nth-child(2){background:var(--acc2);opacity:.8}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:20px 0 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:20px;margin-bottom:6px}.card p{margin:0;color:var(--mut)}
h2{font-size:clamp(26px,4vw,38px);margin-top:20px;letter-spacing:-.02em}
footer{padding:30px 20px;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
.dash{display:grid;gap:22px;grid-template-columns:340px 1fr;padding-bottom:50px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}label:first-child{margin-top:0}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tpl{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;color:var(--ink);font:inherit;font-size:13px}
.tpl[aria-pressed=true]{border-color:var(--acc);background:var(--card)}
.tpl span{display:block;font-size:24px}
.sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.sec header{padding:0 0 8px;display:flex;gap:6px;flex-wrap:wrap}
.sec header b{flex:1;min-width:90px}
.sec input,.sec textarea{margin-top:6px;min-height:0;padding:7px 9px}
.sec textarea{min-height:56px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.bar .sp{flex:1}
iframe{width:100%;height:640px;border:1px solid var(--line);border-radius:14px;background:#fff}
.empty{border:2px dashed var(--line);border-radius:14px;padding:50px 20px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:9}
.hide{display:none!important}
@media(max-width:860px){.hero,.dash{grid-template-columns:1fr}.hero{padding-top:24px}iframe{height:520px}}
@media(prefers-reduced-motion:no-preference){.btn{transition:transform .15s}.btn:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#home">WebGenius<i>.</i>AI</a>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="btn alt sm" href="#dashboard" data-t="navDash"></a>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option></select>
  </div>
</header>

<main id="v-home" class="wrap">
  <section class="hero">
    <div>
      <span class="demo" data-t="badge"></span>
      <h1 data-t="h1"></h1>
      <p data-t="sub"></p>
      <a class="btn" href="#dashboard" data-t="cta"></a>
    </div>
    <div class="mock" aria-hidden="true"><b></b><div><span class="h" style="display:block"></span><span class="l" style="display:block"></span><span class="l" style="display:block;width:80%"></span></div><span class="g"><span></span><span></span><span></span></span></div>
  </section>
  <h2 data-t="howT"></h2>
  <div class="grid" id="how"></div>
  <h2 data-t="tplT"></h2>
  <div class="grid" id="tplList"></div>
</main>

<main id="v-dash" class="wrap hide">
  <div class="dash">
    <div class="panel">
      <label for="desc" data-t="dDesc"></label>
      <textarea id="desc" data-p="dPh"></textarea>
      <label for="sname" data-t="dName"></label>
      <input id="sname" data-p="dNamePh">
      <label data-t="dTpl"></label>
      <div class="tpls" id="tpls"></div>
      <p style="margin:16px 0 8px"><button class="btn" id="gen" style="width:100%" data-t="gen"></button></p>
      <small style="color:var(--mut)" data-t="dNote"></small>
      <div id="editor" class="hide">
        <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
        <label for="color" data-t="color"></label>
        <input type="color" id="color" style="height:42px;padding:3px">
        <label for="en" data-t="siteName"></label>
        <input id="en">
        <div id="secs"></div>
      </div>
    </div>
    <div>
      <div class="bar hide" id="bar">
        <b data-t="preview"></b><span class="sp"></span>
        <button class="btn alt sm" id="copy" data-t="copy"></button>
        <button class="btn sm" id="zip" data-t="zip"></button>
      </div>
      <div class="empty" id="empty" data-t="empty"></div>
      <iframe id="pv" class="hide" title="Preview"></iframe>
    </div>
  </div>
</main>

<footer data-t="foot"></footer>
<div class="toast hide" id="toast"></div>

    if(s.k=="hero")h+='<div class="hero"><h1>'+esc(s.t)+'</h1><p>'+esc(s.x)+'</p></div>';
    if(s.k=="items"){
      if(S.shop)h+='<section><h2>'+esc(s.t)+'</h2><div class="g shop">'+s.i.map(function(a,n){return '<div class="c p"><img src="'+art(n)+'" alt="'+esc(a[0])+'"><div class="pb"><h3>'+esc(a[0])+'</h3><p>'+esc(a[1])+'</p><div class="pr">'+esc(a[2]||"")+'</div><button onclick="cc.textContent=+cc.textContent+1">'+esc(S.btn)+'</button></div></div>'}).join("")+'</div></section>';
      else h+='<section><h2>'+esc(s.t)+'</h2><div class="g">'+s.i.map(function(a){return '<div class="c"><h3>'+esc(a[0])+'</h3><p>'+esc(a[1])+'</p></div>'}).join("")+'</div></section>';
    }
    if(s.k=="about")h+='<section class="about"><h2>'+esc(s.t)+'</h2><p>'+esc(s.x)+'</p></section>';
    if(s.k=="contact")h+='<section class="contact"><h2>'+esc(s.t)+'</h2><a href="mailto:'+esc(s.x)+'">'+esc(s.x)+'</a></section>';
  });
  return h+'<footer>© '+esc(S.name)+'</footer>';
}
function page(inline){
  return '<!DOCTYPE html>\n<html lang="'+S.lang+'">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(S.name)+'</title>\n'+
  (inline?'<style>'+siteCSS()+'</style>':'<link rel="stylesheet" href="style.css">')+'\n</head>\n<body>\n'+siteBody()+'\n</body>\n</html>';
}
function refresh(){ if(S) $("pv").srcdoc=page(true); }

// ---------- 5. EDITOR PANEL ----------
function buildPanel(){
  var h="";
  S.secs.forEach(function(s,n){
    h+='<div class="sec"><header><b>'+esc(t("secN")[["hero","items","about","contact"].indexOf(s.k)])+'</b>'+
    '<button class="btn alt sm" data-a="tog" data-n="'+n+'">'+(s.on?t("hide"):t("show"))+'</button>'+
    '<button class="btn alt sm" data-a="up" data-n="'+n+'" aria-label="'+t("up")+'">↑</button>'+
    '<button class="btn alt sm" data-a="dn" data-n="'+n+'" aria-label="'+t("down")+'">↓</button></header>'+
    '<input data-n="'+n+'" data-f="t" value="'+esc(s.t)+'">';
    if(s.x!==undefined)h+='<textarea data-n="'+n+'" data-f="x">'+esc(s.x)+'</textarea>';
    if(s.i)s.i.forEach(function(a,j){h+='<input data-n="'+n+'" data-j="'+j+'" data-f="a0" value="'+esc(a[0])+'"><input data-n="'+n+'" data-j="'+j+'" data-f="a1" value="'+esc(a[1])+'">'+(a.length>2?'<input data-n="'+n+'" data-j="'+j+'" data-f="a2" value="'+esc(a[2])+'">':'')});
    h+='</div>';
  });
  $("secs").innerHTML=h;
}
$("secs").addEventListener("input",function(e){
  var el=e.target,s=S.secs[el.dataset.n],f=el.dataset.f; if(!s)return;
  if(f=="t")s.t=el.value; else if(f=="x")s.x=el.value;
  else s.i[el.dataset.j][+f.slice(1)]=el.value;
  refresh();
});
$("secs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var n=+b.dataset.n,a=b.dataset.a,A=S.secs;
  if(a=="tog")A[n].on=A[n].on?0:1;
  if(a=="up"&&n>0){var x=A[n];A[n]=A[n-1];A[n-1]=x}
  if(a=="dn"&&n<A.length-1){var y=A[n];A[n]=A[n+1];A[n+1]=y}
  buildPanel();refresh();
});
$("color").addEventListener("input",function(e){S.color=e.target.value;refresh()});
$("en").addEventListener("input",function(e){S.name=e.target.value;refresh()});

// ---------- 6. EXPORT ----------
function readme(){return "WebGenius AI export\n===================\nOpen index.html in any browser.\nEdit the text in index.html and the colors in style.css.\nUpload both files to any free host (GitHub Pages, Netlify, Cloudflare Pages).\n\nGenerated from a DEMO template. No AI was used.\n"}
$("zip").onclick=function(){
  if(!S)return;
  if(typeof JSZip==="undefined"){toast(t("toastFail"));return}
  var z=new JSZip();z.file("index.html",page(false));z.file("style.css",siteCSS().split("}").join("}\n"));z.file("README.txt",readme());
  z.generateAsync({type:"blob"}).then(function(b){
    try{var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="website.zip";document.body.appendChild(a);a.click();a.remove();toast(t("toastZip"))}
    catch(err){toast(t("toastFail"))}
  }).catch(function(){toast(t("toastFail"))});
};
$("copy").onclick=function(){
  if(!S)return;
  try{navigator.clipboard.writeText(page(true)).then(function(){toast(t("toastCopy"))},function(){toast(t("toastFail"))})}catch(e){toast(t("toastFail"))}
};

// ---------- 7. UI: LANGUAGE, TEMPLATES, ROUTING ----------
function drawTemplates(){
  $("tpls").innerHTML=t("tn").map(function(n,i){return '<button class="tpl" data-i="'+i+'" aria-pressed="'+(i==tplIdx)+'"><span>'+ICONS[i]+'</span>'+n+'</button>'}).join("");
  $("tplList").innerHTML=t("tn").map(function(n,i){return '<a class="card" href="#dashboard" data-i="'+i+'" style="text-decoration:none"><h3>'+ICONS[i]+' '+n+'</h3><p>'+esc(TPL[lang][i][1])+'</p></a>'}).join("");
  $("how").innerHTML=[1,2,3].map(function(i){return '<div class="card"><h3>'+t("h"+i+"t")+'</h3><p>'+t("h"+i+"d")+'</p></div>'}).join("");
}
$("tpls").onclick=function(e){var b=e.target.closest(".tpl");if(b){tplIdx=+b.dataset.i;drawTemplates()}};
$("tplList").onclick=function(e){var a=e.target.closest("a");if(a)tplIdx=+a.dataset.i;drawTemplates()};
$("gen").onclick=generate;

function applyLang(l){
  lang=l;document.documentElement.lang=l;$("lang").value=l;
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
  document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=t(e.dataset.p)});
  drawTemplates();
  try{localStorage.setItem("wg-lang",l)}catch(e){}
}
$("lang").onchange=function(e){applyLang(e.target.value)};
function route(){
  var d=location.hash=="#dashboard";
  $("v-home").classList.toggle("hide",d);$("v-dash").classList.toggle("hide",!d);window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
var saved="en";try{saved=localStorage.getItem("wg-lang")||(navigator.language||"en").slice(0,2)}catch(e){}
applyLang(T[saved]?saved:"en");route();
</script>
</body>
</html>
